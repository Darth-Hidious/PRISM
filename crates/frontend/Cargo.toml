[package]
name = "prism-frontend"
description = "Shared native driver for PRISM frontends (TUI, Desktop): in-process agent sessions, no subprocess/RPC transport."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
prism-runtime = { path = "../runtime" }
prism-client = { path = "../client" }
chrono.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
prism-llm = { path = "../llm" }
prism-agent = { path = "../agent" }
prism-python-bridge = { path = "../python-bridge" }
