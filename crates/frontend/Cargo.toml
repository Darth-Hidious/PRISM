[package]
name = "prism-frontend"
description = "Shared native driver for PRISM frontends (TUI, Desktop): in-process agent sessions, no subprocess/RPC transport."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
sha2.workspace = true
prism-runtime = { path = "../runtime" }
prism-core = { path = "../core" }
prism-client = { path = "../client" }
prism-node = { path = "../node" }
chrono.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
prism-llm = { path = "../llm" }
prism-agent = { path = "../agent" }
prism-python-bridge = { path = "../python-bridge" }

[dev-dependencies]
# Arms the live-store guard for this crate's test targets (see
# crates/agent/Cargo.toml): without it, tests here can open ~/.prism.
prism-agent = { path = "../agent", features = ["test-guard"] }
