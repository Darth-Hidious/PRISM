[package]
name = "prism-tui"
description = "Full-screen Ratatui terminal UI for PRISM — chat, tools, approvals, slash commands."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
crossterm = { workspace = true, features = ["event-stream", "bracketed-paste"] }
ratatui-textarea = "0.9"
# Artifacts the agent produces must be SEEN, not reported as a file path. This
# renders them as a normal ratatui widget taking a `Rect`, so PRISM keeps one
# layout engine and the workspace pane cannot be drawn over (the failure in
# tui-3-still-broken.png). Kitty / Sixel / iTerm2 with a halfblocks fallback,
# protocol detected at runtime.
#
# `default-features = false` deliberately: the default set enables `chafa-dyn`,
# which needs pkg-config and the chafa C library at build time. The terminal
# graphics protocols are built in and do not depend on it, so dropping it costs
# nothing and keeps the build free of a system dependency.
# Decoding the artifact before `ratatui-image` re-encodes it for the
# terminal. Pinned to the same major `ratatui-image` resolves (^0.25.6) so one
# `DynamicImage` type crosses the boundary rather than two incompatible ones.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
unicode-width = { workspace = true }
unicode-truncate = "2"
strip-ansi-escapes = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
arboard = "3"
prism-client = { path = "../client" }
prism-frontend = { path = "../frontend" }
# The knowledge-pane file picker asks the ingest connector registry which
# tabular extensions are ingestable instead of keeping its own list.
prism-ingest = { path = "../ingest" }
prism-llm = { path = "../llm" }
prism-python-bridge = { path = "../python-bridge" }
prism-provenance = { path = "../provenance" }
# Shared offline and retry policies.
prism-runtime = { path = "../runtime" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
insta = "1"
# Round-trips the notebook run-command through the same parser the backend
# uses, proving multi-line code survives the slash-command transport.
shlex = "1"
