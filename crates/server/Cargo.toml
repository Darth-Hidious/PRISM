[package]
name = "prism-server"
description = "Embedded Axum HTTP/WebSocket server — REST API, role-gated routes, and web dashboard host."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Digests filesystem-path origins before they are served to mesh peers, so a
# subscriber learns whether two sources differ without learning the path.
sha2 = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
prism-agent = { path = "../agent" }
prism-audit = { path = "../audit" }
prism-client = { path = "../client" }
tokio-stream = { workspace = true }
prism-core = { path = "../core" }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
prism-embed = { path = "../embed" }
prism-ingest = { path = "../ingest" }
prism-mesh = { path = "../mesh" }
prism-node = { path = "../node" }
prism-provenance = { path = "../provenance" }
dirs = { workspace = true }
prism-workflows = { path = "../workflows" }
prism-policy = { path = "../policy" }
uuid = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { workspace = true, features = ["util"] }
prism-python-bridge = { path = "../python-bridge" }
# Arm prism-agent's live-store guard for this crate's test runs and expose
# agent's test-support (pre-main store isolation). The chat-handler tests
# drive the REAL agent loop, which otherwise opens the user's live
# ~/.prism/provenance.db (caught by the guard under `cargo test --workspace`).
prism-agent = { path = "../agent", features = ["test-guard"] }
ctor = "1.0.12"
