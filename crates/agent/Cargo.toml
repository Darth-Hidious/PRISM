[package]
name = "prism-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
local-inference = ["prism-llm/local-inference"]
local-inference-cuda = ["prism-llm/local-inference-cuda"]
# Test-only guard: resolving the DEFAULT provenance store path
# (~/.prism/provenance.db — the user's live database) aborts the process.
# Enabled for every test target of this crate through the self
# dev-dependency below; dev-dependencies never apply to production builds,
# so production resolution is unchanged. See hooks::provenance_db_path.
test-guard = []

[dependencies]
prism-core = { path = "../core" }
prism-ingest = { path = "../ingest" }
prism-llm = { path = "../llm" }
prism-node = { path = "../node" }
prism-policy = { path = "../policy" }
prism-python-bridge = { path = "../python-bridge" }
prism-client = { path = "../client" }
prism-runtime = { path = "../runtime" }
prism-workflows = { path = "../workflows" }
prism-provenance = { path = "../provenance" }
prism-embed = { path = "../embed" }
prism-campaign = { path = "../campaign" }

regex = "1"
# Structured-output verification for the orchestrator (self-contained JSON
# Schemas on delegated tasks). External `$ref` is rejected by scan before
# compilation, so no resolver ever fetches anything.
jsonschema = { version = "0.30", default-features = false }
rmcp = { workspace = true }
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
dirs = "6"
chrono.workspace = true
directories.workspace = true
shlex = "1"
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
# killpg() to reap a wedged notebook kernel's whole process group.
libc.workspace = true

[dev-dependencies]
tempfile = "3"
async-trait = { workspace = true }
# For the HTTP chat parity/approval integration tests (tests/http_chat_parity.rs):
# stub OpenAI-compatible LLM server + direct use of the loop's own types.
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
prism-ingest = { path = "../ingest" }
prism-python-bridge = { path = "../python-bridge" }
turso = { workspace = true }
# Self dev-dependency: turns `test-guard` on for every test target of this
# crate (lib unit tests and tests/*) without affecting downstream builds.
# Removing this silently disarms the live-store guard —
# tests/store_isolation.rs trips if that happens.
prism-agent = { path = ".", features = ["test-guard"] }
ctor = "1.0.12"
