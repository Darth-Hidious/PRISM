# The ONE definition of how the hosted platform is named to users.
#
# PRISM stands alone as a product. The company operating the hosted
# platform is NOT named in any user-visible string — PRISM describes the
# service it connects to by what it is ("hosted platform"), never by who
# runs it. These values are deliberately generic nouns; a downstream
# white-labeller can put their own name here, but the shipped product
# names no company.
#
# ── What belongs here ─────────────────────────────────────────────────
# User-visible strings only: things a human reads in help text, prompts,
# error messages, and listings.
#
# ── What deliberately does NOT belong here ────────────────────────────
# WIRE IDENTIFIERS. These are a compatibility surface — shipped clients,
# existing installs, and on-disk state depend on their exact spelling. PRISM
# now has canonical PRISM_* environment names; the historical provider names
# below are FROZEN DEPRECATED ALIASES and stay hardcoded on purpose:
#
#   • env aliases    MARC27_API_KEY, MARC27_TOKEN, MARC27_API_URL,
#                    MARC27_PLATFORM_URL, MARC27_PROJECT_ID
#   • API key prefix `m27_` (the platform routes it to X-API-Key by shape)
#   • config values  `[chat] mode = "marc27"`, `[indexer] mode = "marc27"`,
#                    `prism use marc27`, `publish --to marc27`,
#                    `run --backend marc27`
#   • on-disk paths  ~/.prism/ (PRISM's own name, not the company's)
#
# Changing any of those is a breaking change with a deprecation window,
# not a rename. Renaming the COMPANY does not require renaming them.

# How the service is referred to mid-sentence, e.g. "Token rejected by
# the platform". Written to read naturally inside a sentence.
display_name = "the platform"

# How the hosted platform is named as a chat/provider target, e.g. in
# `prism use list` and "hosted platform (logged in)".
platform_name = "hosted platform"

# Where a user goes to sign up. A live address, not a byline — it has to
# resolve, so it is exempt from the no-company-name rule the same way
# `api.marc27.com` is. It is not rendered as a name anywhere.
docs_url = "https://marc27.com"

# One-line description shown next to the platform in `prism use list`,
# alongside "your own key · OPENAI_API_KEY" and friends. States what the
# entry requires, nothing more — the other rows describe themselves the
# same way, and PRISM does not advertise any provider over the rest.
tagline = "hosted models — no key required"
