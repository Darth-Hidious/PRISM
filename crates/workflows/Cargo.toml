[package]
name = "prism-workflows"
description = "YAML workflow engine — discovery, template interpolation, step execution, and CLI command promotion."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Test-only guard: a provenance step that falls through to the $HOME store
# fallback (the user's live ~/.prism/provenance.db) aborts the process.
# Armed for this crate's own test targets by the self dev-dependency below;
# dev-dependencies never apply to production builds.
test-guard = []

[dependencies]
prism-runtime = { path = "../runtime" }
anyhow.workspace = true
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true
prism-policy = { path = "../policy" }
prism-llm = { path = "../llm" }
prism-provenance = { path = "../provenance" }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
# Self dev-dependency: arms `test-guard` for every test target of this crate.
prism-workflows = { path = ".", features = ["test-guard"] }
