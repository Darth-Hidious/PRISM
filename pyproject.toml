[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-platform"
version = "1.0.0"
description = "AI-Native Autonomous Materials Discovery Platform"
readme = "README.md"
authors = [{ name = "Mirdyne", email = "team@marc27.com" }]
license = "LicenseRef-Mirdyne-Dual"
license-files = ["LICENSE", "LICENSE-MIT", "LICENSE-MIRDYNE"]
maintainers = [
    {name = "PRISM Development Team", email = "team@marc27.com"}
]
keywords = [
    "materials science", "materials discovery", "autonomous agents",
    "OPTIMADE", "CALPHAD", "machine learning", "MCP",
    "scientific computing", "AI", "LLM",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]
requires-python = ">=3.11"
dependencies = [
    "rich>=12.0.0",
    "PyYAML>=6.0.0",
    "optimade[http-client]>=1.2.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "google-cloud-aiplatform>=1.0.0",
    "anthropic>=0.20.0",
    "pandas>=2.0.0",
    "tenacity>=8.0.0",
    "requests>=2.28.0",
    "mp-api>=0.45.0",
    "matplotlib>=3.7.0",
    "joblib>=1.3.0",
    "fastmcp>=3.0.0",
    "httpx>=0.24.0",
    "firecrawl-py>=1.0.0",
    # ddgs is the maintained successor of duckduckgo-search; web.py tries
    # it first. Keep the legacy package for older installed tool code.
    "ddgs>=9.0.0",
    "duckduckgo-search>=7.0.0",
    "beautifulsoup4>=4.12.0",
    # VS2-P2: symbolic_check grounds verification in sympy. Pin at top level so
    # a pymatgen refactor cannot silently drop the transitive dependency.
    "sympy>=1.12",
    # CORE, not a `[mace]` extra. Torch-free MACE modules import ULID at module
    # scope, so a default install must provide this small pure-Python package.
    "python-ulid>=2.0.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "optuna>=3.4.0",
    "pymatgen>=2024.1.1",
    "matminer>=0.9.0",
    "matgl>=1.0.0",
    "matplotlib>=3.7.0",
    "pyarrow>=14.0.0",
    "joblib>=1.3.0",
    # robocrystallographer: generates human-readable structure descriptions
    # from crystallographic data (the describe_structure tool). pymatgen-
    # ecosystem (hackingmaterials.lbl.gov). Not yet published for Python 3.14
    # (no wheel); gate below 3.14 so it installs on 3.12/3.13 and the tool
    # degrades honestly ("robocrystallographer not installed") on 3.14.
    "robocrystallographer>=0.2.3; python_version<'3.14'",
]
simulation = [
    # pyiron officially supports Python 3.9–3.14 as of pyiron_atomistics /
    # atomistics 0.3.6 (released 2026-04-28); requires-python in their
    # pyproject.toml is `>=3.9, <3.15`. We mirror that window so users on
    # Python 3.14 (the current default on macOS arm64) get simulation
    # extras instead of being silently excluded. See docs/pyiron_integration.md
    # for the architectural boundary between PRISM and pyiron.
    "pyiron-base>=0.9; python_version<'3.15'",
    "pyiron-atomistics>=0.6; python_version<'3.15'",
]
qe = [
    # Quantum ESPRESSO input/output path (app/tools/simulation/qe): pw.x
    # .in writing + .out parsing through ASE's espresso formats, structure
    # handling through pymatgen. Deliberately pyiron-free — this path does
    # not use or require pyiron at all.
    "ase>=3.23.0",
    "pymatgen>=2024.1.1",
]
lpbf = [
    # LPBF Rosenthal process-window maps and Kou cracking index
    # (app/tools/manufacturing/lpbf). Kept out of the base install and gated
    # at bootstrap so missing numerical dependencies leave no ghost tools.
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
]
calphad = [
    # pycalphad supports Python 3.9–3.14; same window as pyiron.
    "pycalphad>=0.10,<0.12; python_version<'3.15'",
    # The `scheil` package: free Scheil solidification simulation built on
    # pycalphad (the Thermo-Calc Scheil Calculator equivalent). Used by the
    # scheil_solidification tool for non-equilibrium solidification paths.
    "scheil>=0.2.0; python_version<'3.15'",
]
cluster-expansion = [
    # icet (cluster expansion; ships mchammer for Monte Carlo) and trainstation
    # (its fitting/CV package). Used by cluster_expansion_fit / monte_carlo_sro;
    # training energies come from the [mace] extra's calculator.
    "icet>=3.0",
    "trainstation>=1.0",
]
polymer = [
    # RDKit validates polymer identity (repeat unit / monomer / SMILES) for
    # app/tools/materials/polymer. Registration is already gated on
    # check_polymer_available(), so without this the tool degrades honestly --
    # but there was no extra a user could install to GET it, which made the
    # install hint unactionable. Declaring it closes that.
    "rdkit>=2024.3.1",
]

precipitation = [
    # Kampmann-Wagner Numerical precipitation kinetics (the TC-PRISMA
    # capability) via kawin, used by app/tools/materials/precipitation.
    # kawin 0.5.0 declares pycalphad>=0.11, which intersects this repo's
    # calphad-extra pin (pycalphad>=0.10,<0.12) at 0.11.x -- no conflicting
    # second pin is declared here; pip resolves the shared constraint.
    # kawin requires Python >= 3.11; upper-capped at 0.6 because its API
    # is still churning (upstream: "There has been a lot of changes in the
    # API").
    "kawin>=0.5.0,<0.6; python_version>='3.11' and python_version<'3.15'",
]
mace = [
    # MACE foundation interatomic potentials (MACE-MP-0, MACE-MH-1).
    #
    # Framework note: PRISM's broader stack is JAX-native by default
    # (jax-md / Flax / Equinox / NumPyro / BlackJAX), but MACE-MH-1 is
    # shipped PyTorch-only by the upstream maintainers — `mace-jax` does
    # not support the multi-head MH-1 architecture as of 2026. We pin
    # mace-torch + torch here, and the MACE marketplace metadata in
    # marc27-core records `framework: pytorch, tier: hybrid-pending-jax`
    # so the research agent routes framework-aware.
    "mace-torch>=0.3.12",
    "torch>=2.5.0",
    "ase>=3.23.0",
    # python-ulid moved to core `dependencies` — see the note there.
    # numpy is already a transitive dep but pin it explicitly so mace
    # primitive code has a known floor.
    "numpy>=1.26,<3.0",
    # Undeclared until 2026-07-27, when the marketplace dependency-drift
    # test caught them: both are hard function-scope imports that raise
    # ModuleNotFoundError on an otherwise-complete `[mace]` install.
    #   huggingface_hub — app/tools/simulation/mace/core/calculator.py and
    #     .../backends/hf_jobs.py fetch the MACE weights with it. It is NOT
    #     a mace-torch dependency (mace-torch 0.3.16 requires_dist has no
    #     huggingface-hub), so it has to be declared here.
    #   phonopy — app/tools/simulation/mace/core/phonons.py needs it for
    #     the harmonic phonon primitive.
    # Left unpinned deliberately: no floor is claimed that has been tested.
    "huggingface-hub",
    "phonopy",
]
data = [
    "datasets>=3.0.0",
]
reports = [
    "markdown>=3.5",
    "weasyprint>=60.0",
]
 all = [
    "prism-platform[ml,calphad,precipitation,mace,qe,lpbf,data,reports]",
 ]
full = [
    "prism-platform[all,simulation]",
]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires HF_TOKEN and real HF Jobs (skipped unless MACE_MCP_LIVE=1)",
    "needs_mace: requires mace-torch installed (skipped if missing)",
    "network: hits real third-party sources (skipped unless PRISM_LIVE_SOURCES=1)",
]

[project.urls]
Homepage = "https://github.com/Darth-Hidious/PRISM"
Repository = "https://github.com/Darth-Hidious/PRISM"
"Bug Reports" = "https://github.com/Darth-Hidious/PRISM/issues"

[tool.setuptools]
include-package-data = true

# Subpackages are DISCOVERED, not enumerated. The hand-maintained list this
# replaces had silently gone stale: `app.tools.memory` and
# `app.tools.materials` were never added to it, so the published wheel
# shipped without them. `app/tools/base.py` imports the memory recorder on
# every tool call and `bootstrap` imports both, so on an installed venv the
# imports failed, the provider registry fell back to empty, and
# `materials_search` answered `{"materials": [], "count": 0}` with exit 0.
# A list you have to remember to update is how that happens; discovery is
# how it stops happening.
[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

# Non-.py assets. Without these the wheel is code-only: the search
# federation's `provider_overrides.json` went missing exactly this way, and
# `load_overrides()` reads it unguarded, so provider discovery raised
# FileNotFoundError on every installed copy.
#
# `tests/test_packaging.py` asserts that EVERY non-.py file under `app/`
# reaches the built wheel — that test, not this list, is the invariant. If
# a new asset type or a new nested data directory appears, the test fails
# loudly instead of the tool answering emptily.
[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.tdb", "*.csv", "*.txt"]
# Nested data directory (not itself a package) under app.tools.materials.
"app.tools.materials" = ["tdb/*.tdb"]
#
# No `exclude-package-data` counterpart: these patterns only match a
# package's own directory, so nothing under `app/.claude/` or
# `app/.srclight/` can be swept up (and both are gitignored, so a release
# build never sees them at all). An exclusion here was written, measured
# against a mutation, found to change nothing, and removed rather than left
# as reassuring but inert config. The sdist is a different story — see
# MANIFEST.in.

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
