name: Integration Test

on:
  pull_request:
    paths:
      - "crates/**"
      - "app/**"
      - "dashboard/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/integration-test.yml"
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/integration-test.yml"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust Unit Tests
    runs-on: [self-hosted, linux, ARM64]
    env:
      # The 15G runner OOM-kills `ld` (signal 9). Step-level debug=0 wasn't
      # enough: the v1 cache still held debuginfo-fat rlibs, and parallel
      # links stacked several multi-GB `ld`s. Job-wide debug=0 + jobs=2 +
      # a v2 cache bust keep peak linker memory bounded. RUSTC_WRAPPER=""
      # bypasses the runner's global sccache, whose /tmp race loses .d
      # files mid-compile ("could not parse/generate dep info").
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      RUSTC_WRAPPER: ""
      # Per-workflow target dir: rust-cache's post-job prune in the sibling
      # workflow otherwise deletes files under this job's live build.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-integration
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (rdkafka needs libcurl)
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev protobuf-compiler
      - name: Create dashboard dist placeholder (rust-embed needs it)
        run: mkdir -p dashboard/dist && echo '<html><body>placeholder</body></html>' > dashboard/dist/index.html
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Bump suffix to invalidate cache after the runner cargo config
          # changed (mold removed in favor of default ld + debuginfo=1).
          # Self-hosted target dirs otherwise persist stale link-args.
          prefix-key: "v2-rust-debuginfo0-jobs2"
          # Self-hosted runner shares CARGO_HOME across jobs. rust-cache's
          # default post-cleanup wipes ~/.cargo/bin to reduce cache size,
          # which deletes pre-installed cargo-audit and similar binaries.
          # Disable bin-caching so the Security Audit job (which expects
          # cargo-audit to persist) can rely on it across runs.
          cache-bin: "false"
      - name: Reset poisoned target dir (one-shot via runner-local sentinel)
        run: |
          SENTINEL=$HOME/.cache/prism-runner-cache-bust-v2-integration
          if [ ! -f "$SENTINEL" ]; then
            echo "Cache-bust v2: wiping target/ once for this runner"
            cargo clean
            mkdir -p "$HOME/.cache"
            touch "$SENTINEL"
          else
            echo "Sentinel present — target/ already cache-busted"
          fi
      # CARGO_PROFILE_TEST_DEBUG=0: the workspace's test binaries (polars,
      # axum, fastembed…) OOM-killed the runner's linker with full debuginfo
      # ("ld terminated with signal 9"). Debuginfo off in CI tests — locally
      # unchanged.
      - run: cargo test --workspace
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
      - run: cargo clippy --workspace --all-targets -- -D warnings

  dashboard-build:
    name: Dashboard Build
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: cd dashboard && npm ci
      - run: cd dashboard && npm audit --audit-level=high
      - run: cd dashboard && npx tsc -b --noEmit
      - run: cd dashboard && npx vite build

  python-tools:
    name: Python Tool Loading
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[all]" 2>/dev/null || pip install -e . || true
      - name: Verify tool registry loads
        run: |
          python3 -c "
          import sys; sys.path.insert(0, '.')
          try:
              from app.plugins.bootstrap import build_full_registry
              result = build_full_registry()
              reg = result[0]
              tools = reg.list_tools()
              print(f'Tools loaded: {len(tools)}')
              assert len(tools) >= 30, f'Expected 30+ tools, got {len(tools)}'
              print('PASS: Tool registry loads correctly')
          except Exception as e:
              print(f'FAIL: {e}')
              sys.exit(1)
          "
      - name: Lint tool schemas + descriptions (TOOL_SURFACE_SPEC D1-D4)
        run: PRISM_DISABLE_MEMORY=1 python3 scripts/lint_tool_schemas.py

  python-suite:
    name: Python Test Suite
    # Until this job existed, NOTHING in .github/workflows ran pytest — every
    # job here and in rust-backbone.yml is cargo, npm or a one-off python -c.
    # That is how a defect that broke every execute_bash after a search
    # survived a release with a test suite sitting in tests/.
    #
    # WHAT THIS JOB CANNOT PROVE. The runner is ARM64 Linux. The fork hazard
    # tests/test_fork_safety.py exists for is Apple Network.framework's atfork
    # handler, which does not exist here, so the "survives a materials search"
    # half of that file is meaningless on this runner even when it passes.
    # Its "never forks" half is not: that one intercepts CPython's fork+exec
    # entry point directly and holds on any platform. Read a green here as
    # "no call site reaches fork()", never as "the macOS crash is fixed" —
    # only a macOS run can say that.
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PRISM + test dependencies
        # Deliberately no `|| true`. If the install fails there is nothing to
        # test, and continuing would report a green on an empty run.
        #
        # `[dev]` only, not `[ml]`: matgl/torch is several GB on a 15G runner
        # already shared with two cargo target dirs. The 12 tests that need
        # scikit-learn, the 3 that need pycalphad and the pexpect-based TUI
        # e2e file skip with that reason printed by `-rs` below, so the log
        # says what went unrun instead of implying full coverage.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"
      - name: pytest tests/
        run: python3 -m pytest tests/ -q -rs
      - name: pytest tests/ in reversed file order
        # Alphabetical order is exactly what hid the fork-safety defect: the
        # file that poisoned the process happened to sort after the files it
        # broke, so `pytest tests/` was green while the same files reversed
        # were 19 red. A forward-only run would have caught nothing.
        #
        # No pipe into `tail`/`tee` here: a shell pipeline exits with the LAST
        # command's status, so `pytest | tail` reports tail's 0 and turns a red
        # run green. The step is the bare pytest, and `bash -e` fails the job.
        run: |
          # Splitting the substitution is the mechanism, not an accident: one
          # shell word per test file. The names are `test_*.py`, so there is
          # nothing here to split badly on.
          # shellcheck disable=SC2046
          set -- $(printf '%s\n' tests/test_*.py | sort -r)
          # An unmatched glob hands back the literal pattern; say so rather
          # than let pytest's "no tests collected" read as a pass.
          test -e "$1" || { echo "no tests/test_*.py matched"; exit 1; }
          echo "reversed order: $# files, first is $1"
          python3 -m pytest -q -rs "$@"

  ingest-pipeline:
    name: Ingest Pipeline (bundled Turso store)
    runs-on: [self-hosted, linux, ARM64]
    needs: [rust-tests]
    # Non-blocking. The job spawns a Python worker via `prism ingest`
    # that pip-installs `prism-platform`, which transitively pulls in
    # `pycalphad`. pycalphad requires gfortran + LAPACK/BLAS to build
    # from source on ARM64 Linux, which this runner does not yet have.
    # Follow-up: either install scientific compilers via apt OR pin a
    # prism-platform venv in /home/ghrunner/.venvs/ the same way the
    # marc27-core Runtime Sidecar Tests job does its PyMuPDF/fastapi
    # venv.
    continue-on-error: true
    env:
      # Same linker-memory caps as rust-tests: this job links the full
      # `prism` binary on the same 15G box.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      RUSTC_WRAPPER: ""
      # Same dir as rust-tests (safe: needs:[rust-tests] serializes them);
      # isolated from the backbone workflow's prune.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-integration

    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (rdkafka needs libcurl)
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev protobuf-compiler
      - name: Create dashboard dist placeholder (rust-embed needs it)
        run: mkdir -p dashboard/dist && echo '<html><body>placeholder</body></html>' > dashboard/dist/index.html

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Match the other self-hosted rust-cache calls in this file
          # so the shared ~/.cargo/bin doesn't get wiped between jobs.
          prefix-key: "v2-rust-debuginfo0-jobs2"
          cache-bin: "false"

      - name: Build CLI binary
        run: cargo build --bin prism

      - name: Test schema-only ingest
        run: |
          "$CARGO_TARGET_DIR"/debug/prism ingest tests/data/refractory_heas.csv --schema-only 2>&1 | tee /tmp/schema.out
          grep -q "15 columns, 10 rows" /tmp/schema.out

      - name: Test graph query (bundled Turso store, no services)
        run: |
          # A fresh store has no entities — the query must still succeed
          # (exit 0) and report a clean miss, proving the local read path
          # needs no external graph/vector service.
          "$CARGO_TARGET_DIR"/debug/prism query "TestAlloy" 2>&1 | tee /tmp/graph.out
          grep -q "No direct matches" /tmp/graph.out

      - name: Test version flag
        # Read the expected version from the workspace Cargo.toml so this
        # check stays correct across patch bumps. Hardcoding to a specific
        # version (was `prism 2.7.0`) silently broke every PR after the
        # next release tag.
        run: |
          expected=$(grep -E '^version = "[0-9]+\.[0-9]+\.[0-9]+"' Cargo.toml \
            | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          echo "Expecting: prism $expected"
          "$CARGO_TARGET_DIR"/debug/prism --version 2>&1 | grep -F "prism $expected"

      - name: Test node probe
        run: |
          "$CARGO_TARGET_DIR"/debug/prism node probe 2>&1 | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['cpu_cores'] > 0
          assert 'python' in d['software']
          print('PASS: node probe')
          "

      - name: Test workflow list
        # Block scalar, not a bare `run:`. A plain value that STARTS with a
        # quote is a quoted YAML scalar, so everything after the closing quote
        # is a parse error — and GitHub rejects the whole FILE, not the step:
        # every run of this workflow from ecedc1b8 (2026-07-10) until this
        # commit ended in 0s with "workflow file issue" and ran no jobs at all.
        run: |
          "$CARGO_TARGET_DIR"/debug/prism workflow list 2>&1 | grep "forge"

      - name: Test error handling
        run: |
          "$CARGO_TARGET_DIR"/debug/prism ingest /nonexistent.csv 2>&1 | grep -q "not found"
          echo "PASS: missing file error"
