name: Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-native:
    name: Package Native (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux compiles inside Rocky Linux 8.10 (glibc 2.28), not against
          # the Ubuntu host. ONNX Runtime is rebuilt in that same container;
          # using ort-sys's downloaded static archive would import symbols
          # from the newer glibc headers used by pyke's build machine.
          - os: ubuntu-22.04
            label: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            archive: prism-linux-x86_64.tar.gz
          # macos-14 enters full deprecation 2026-11-02; 15 is the safe floor.
          - os: macos-15
            label: macos-aarch64
            rust_target: aarch64-apple-darwin
            archive: prism-macos-aarch64.tar.gz
          - os: windows-latest
            label: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            archive: prism-windows-x86_64.zip
          # Intel Macs — install.sh computes prism-macos-x86_64 for x86_64
          # Darwin. This job FAILED for v1.0.0 (that is why no Intel Mac
          # build has ever shipped): fastembed pulls ort-sys, and pyke
          # publishes no ONNX Runtime for x86_64-apple-darwin. crates/embed
          # now excludes fastembed on that one target, so it builds.
          # GitHub retires x86_64 macOS runners entirely in Aug 2027.
          - os: macos-15-intel
            label: macos-x86_64
            rust_target: x86_64-apple-darwin
            archive: prism-macos-x86_64.tar.gz
          # ARM Linux uses the same native-architecture Rocky 8.10 build.
          - os: ubuntu-22.04-arm
            label: linux-aarch64
            rust_target: aarch64-unknown-linux-gnu
            archive: prism-linux-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (vendored forge_repo needs it on all platforms)
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.rust_target }}

      # Keep target directories isolated by target and by the Rocky-based
      # Linux build recipe. Cached Rust objects were not the __isoc23 cause:
      # those objects came from ort-sys's downloaded libonnxruntime.a.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-${{ matrix.os }}-${{ matrix.rust_target }}"

      # A source build is expensive, but its absolute path is stable inside
      # the container (/work/.native/onnxruntime), so both the ORT build and
      # Cargo's recorded link-search path remain valid after cache restore.
      - name: Cache source-built ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .native/onnxruntime
          key: "onnxruntime-v1.24.2-rockylinux8-gcc11-v2-${{ matrix.rust_target }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dashboard deps
        run: cd dashboard && npm ci

      - name: Build dashboard bundle
        run: cd dashboard && npm run build

      - name: Build Rust binaries (macOS / Windows)
        if: runner.os != 'Linux'
        run: cargo build --locked --release --bin prism --bin prism-node --target ${{ matrix.rust_target }}

      - name: Build Rust binaries with source-built ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git" .native

          # This container is the ABI contract. Both Linux runners are native
          # architecture, so neither leg cross-links against the Ubuntu host.
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e RUST_TARGET="${{ matrix.rust_target }}" \
            -e RUSTUP_HOME=/root/.rustup \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.rustup:/root/.rustup:ro" \
            -v "$HOME/.cargo/bin:/root/.cargo/bin:ro" \
            -v "$HOME/.cargo/registry:/root/.cargo/registry" \
            -v "$HOME/.cargo/git:/root/.cargo/git" \
            -w /work \
            rockylinux/rockylinux:8.10 \
            bash -euxo pipefail -c '
              dnf -y install \
                ca-certificates gcc-toolset-11-gcc gcc-toolset-11-gcc-c++ \
                gcc-toolset-11-libstdc++-devel git libcurl-devel make \
                openssl-devel perl-core pkgconf-pkg-config protobuf-compiler \
                python3.11 python3.11-pip tar which \
                patch diffutils file unzip zlib-devel
              source /opt/rh/gcc-toolset-11/enable
              python3.11 -m pip install --no-cache-dir \
                "cmake==3.31.6" "ninja==1.11.1.4" "packaging==24.2"
              export PATH="/root/.cargo/bin:/usr/local/bin:$PATH"

              case "$RUST_TARGET" in
                x86_64-unknown-linux-gnu) expected_arch=x86_64 ;;
                aarch64-unknown-linux-gnu) expected_arch=aarch64 ;;
                *) echo "::error::unexpected Linux target $RUST_TARGET"; exit 1 ;;
              esac
              [[ $(uname -m) == "$expected_arch" ]]
              [[ $(getconf GNU_LIBC_VERSION) == "glibc 2.28" ]]
              gcc_version=$(gcc -dumpfullversion -dumpversion)
              [[ $(printf "11.1\n%s\n" "$gcc_version" \
                   | sort -V | head -1) == "11.1" ]]
              libstdcpp_a=$(g++ -print-file-name=libstdc++.a)
              [[ "$libstdcpp_a" = /* && -f "$libstdcpp_a" ]]

              echo "Linux build environment:"
              ldd --version 2>&1 | sed -n "1p"
              gcc --version | sed -n "1p"
              echo "libstdc++ archive: $libstdcpp_a"
              rustc --version
              cmake --version | sed -n "1p"

              ort_src=/work/.native/onnxruntime
              ort_common="$ort_src/build/Linux/Release/libonnxruntime_common.a"
              if [[ ! -f "$ort_common" ]]; then
                rm -rf "$ort_src"
                git clone --branch v1.24.2 --depth 1 --recursive \
                  --shallow-submodules \
                  https://github.com/microsoft/onnxruntime.git "$ort_src"
                python3.11 "$ort_src/tools/ci_build/build.py" \
                  --build_dir "$ort_src/build/Linux" \
                  --config Release \
                  --update --build --parallel --skip_tests \
                  --compile_no_warning_as_error \
                  --allow_running_as_root
              fi
              test -f "$ort_common"
              [[ $(git -C "$ort_src" describe --tags --exact-match) == "v1.24.2" ]]
              git -C "$ort_src" rev-parse HEAD

              # This is the exact regression guard: no object supplied by the
              # rebuilt ORT may require glibc 2.38 C23 conversion symbols.
              isoc23_imports=$(find "$ort_src/build/Linux/Release" -name "*.a" \
                -exec nm -u {} + 2>/dev/null | grep "__isoc23_" || true)
              if [[ -n "$isoc23_imports" ]]; then
                printf "%s\n" "$isoc23_imports"
                echo "::error::source-built ONNX Runtime imports __isoc23 symbols"
                exit 1
              fi

              # Point ort-sys at the directory containing the ORT archives.
              # Given the build root, rc.12 chooses _deps/*/Release; build.py
              # produced Release/_deps/*, so its dependency search paths miss.
              export ORT_LIB_LOCATION="$(dirname "$ort_common")"
              export ORT_SKIP_DOWNLOAD=1
              # ORT is only a set of C++ archives at this point. Select the
              # static GCC 11 runtime where ort-sys performs the final link;
              # applying -static-libstdc++ to the ORT build would not do that.
              export ORT_CXX_STDLIB="static=stdc++"
              # rustc resolves a requested static native archive before the
              # final GCC link, so expose the SCL archive directory explicitly.
              export RUSTFLAGS="-Lnative=$(dirname "$libstdcpp_a")"
              cargo build --locked --release --bin prism --bin prism-node \
                --target "$RUST_TARGET"

              check_abi_ceiling() {
                local binary=$1 namespace=$2 ceiling=$3 actual
                actual=$(readelf --version-info "$binary" \
                  | grep -oE "${namespace}_[0-9]+(\\.[0-9]+)*" \
                  | sed "s/${namespace}_//" | sort -Vu | tail -1 || true)
                if [[ -z "$actual" ]]; then
                  echo "$binary: no $namespace dependency"
                  return
                fi
                if [[ $(printf "%s\\n%s\\n" "$actual" "$ceiling" \
                     | sort -V | tail -1) != "$ceiling" ]]; then
                  echo "::error::$binary requires $namespace $actual (ceiling: $ceiling)"
                  return 1
                fi
                echo "$binary: ${namespace}_$actual (ceiling ${namespace}_$ceiling)"
              }

              # Rocky 8 compatibility: glibc 2.28 and base libgcc_s through
              # GCC_7.0.0. GCC 11 libstdc++ is linked statically, so the host
              # should provide neither GLIBCXX nor CXXABI; retain their old
              # ceilings as defense in depth. Inspect the final ELFs so no
              # dependency can silently raise a floor.
              for binary in \
                "target/$RUST_TARGET/release/prism" \
                "target/$RUST_TARGET/release/prism-node"; do
                if readelf --dynamic "$binary" \
                     | grep -F "Shared library: [libstdc++.so.6]" >/dev/null; then
                  echo "::error::$binary dynamically links libstdc++.so.6"
                  exit 1
                fi
                check_abi_ceiling "$binary" GLIBC 2.28
                check_abi_ceiling "$binary" GLIBCXX 3.4.25
                check_abi_ceiling "$binary" CXXABI 1.3.11
                check_abi_ceiling "$binary" GCC 7.0.0
                # Do not let the SCL environment satisfy the smoke test with
                # toolset runtime libraries absent from a stock Rocky 8 host.
                env -u LD_LIBRARY_PATH "$binary" --version </dev/null
              done

              # Cache post-actions run as the host runner user.
              chown -R "$HOST_UID:$HOST_GID" \
                /work/.native /work/target \
                /root/.cargo/registry /root/.cargo/git
            '

      - name: Assemble package
        shell: bash
        env:
          PACKAGE_LABEL: ${{ matrix.label }}
        run: |
          mkdir -p package
          if [[ "$PACKAGE_LABEL" == *windows* ]]; then
            cp target/${{ matrix.rust_target }}/release/prism.exe package/
            cp target/${{ matrix.rust_target }}/release/prism-node.exe package/
            cd package && 7z a -tzip ../${{ matrix.archive }} . && cd ..
          else
            cp target/${{ matrix.rust_target }}/release/prism package/
            cp target/${{ matrix.rust_target }}/release/prism-node package/
            # macOS: ad-hoc sign binaries so users only need to clear quarantine
            if [[ "$PACKAGE_LABEL" == *macos* ]]; then
              codesign -s - -f package/prism
              codesign -s - -f package/prism-node
            fi
            tar -C package -czf ${{ matrix.archive }} .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          overwrite: true


  # Pure-python wheel for the tool platform. install.sh pip-installs this
  # from the release assets (no git needed on the target box).
  python-wheel:
    name: Package Python wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: python3 -m pip wheel . --no-deps -w dist/

      - uses: actions/upload-artifact@v4
        with:
          name: prism-platform-wheel
          path: dist/*.whl
          overwrite: true

  # This is the only job permitted to create a release. GitHub only schedules
  # jobs whose `needs` succeeded; the explicit success() check makes that
  # requirement visible and prevents a failed, cancelled, or queued native leg
  # from ever reaching the release API.
  publish-release:
    name: Publish complete release
    needs: [package-native, python-wheel]
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Verify complete asset set and generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          # Keep this pinned to the declared 1.0.0 package version rather
          # than deriving an asset name from a tag. The manifest is generated
          # only after these exact six build assets are present, and it hashes
          # exactly the six files subsequently uploaded with it.
          expected_assets=(
            prism-linux-x86_64.tar.gz
            prism-linux-aarch64.tar.gz
            prism-macos-x86_64.tar.gz
            prism-macos-aarch64.tar.gz
            prism-windows-x86_64.zip
            prism_platform-1.0.0-py3-none-any.whl
          )
          printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort > expected-assets
          shopt -s dotglob nullglob
          actual_assets=(assets/*)
          for asset in "${actual_assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::downloaded artifact is not a file: $asset"
              exit 1
            fi
          done
          printf '%s\n' "${actual_assets[@]##*/}" | LC_ALL=C sort > actual-assets
          if ! diff -u expected-assets actual-assets; then
            echo "::error::downloaded artifacts are not the complete expected release set"
            exit 1
          fi
          (
            cd assets
            sha256sum "${expected_assets[@]}" > ../SHA256SUMS
          )
          cat SHA256SUMS

      - name: Create release and upload complete asset set
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            assets/prism-linux-x86_64.tar.gz
            assets/prism-linux-aarch64.tar.gz
            assets/prism-macos-x86_64.tar.gz
            assets/prism-macos-aarch64.tar.gz
            assets/prism-windows-x86_64.zip
            assets/prism_platform-1.0.0-py3-none-any.whl
            SHA256SUMS
