name: Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-native:
    name: Package Native (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux: build on 22.04, NOT ubuntu-latest ──────────────────
          # A Rust binary linked against glibc runs on that version OR NEWER,
          # never older. ubuntu-latest is 24.04 (glibc 2.39) and the v1.0.0
          # artifacts built there are hard-broken on every LTS below it:
          #   $ docker run ubuntu:22.04 ./prism --version
          #   /lib/.../libc.so.6: version `GLIBC_2.39' not found
          #   /lib/.../libc.so.6: version `GLIBC_2.38' not found
          #   /lib/.../libstdc++.so.6: version `CXXABI_1.3.15' not found
          # Verified failing on ubuntu:22.04 and debian:12; passing on
          # ubuntu:24.04 and debian:13. Ubuntu 22.04 LTS is the single most
          # common institutional Linux, so that is a silent total loss.
          # 22.04 ships glibc 2.35 + GCC 11, which covers Ubuntu 22.04+,
          # Debian 12+ and SLES 15 SP6+. (RHEL/Rocky 9 sit at glibc 2.34 and
          # still need an older build host — see docs/RELEASING.md.)
          # Runner support ends 2027-04-17; revisit before then.
          - os: ubuntu-22.04
            label: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            archive: prism-linux-x86_64.tar.gz
          # macos-14 enters full deprecation 2026-11-02; 15 is the safe floor.
          - os: macos-15
            label: macos-aarch64
            rust_target: aarch64-apple-darwin
            archive: prism-macos-aarch64.tar.gz
          - os: windows-latest
            label: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            archive: prism-windows-x86_64.zip
          # Intel Macs — install.sh computes prism-macos-x86_64 for x86_64
          # Darwin. This job FAILED for v1.0.0 (that is why no Intel Mac
          # build has ever shipped): fastembed pulls ort-sys, and pyke
          # publishes no ONNX Runtime for x86_64-apple-darwin. crates/embed
          # now excludes fastembed on that one target, so it builds.
          # GitHub retires x86_64 macOS runners entirely in Aug 2027.
          - os: macos-15-intel
            label: macos-x86_64
            rust_target: x86_64-apple-darwin
            archive: prism-macos-x86_64.tar.gz
          # ARM Linux (ARM servers/cloud, incl. our own Hetzner box) —
          # install.sh computes prism-linux-aarch64 for aarch64 Linux.
          # Same glibc-floor reasoning as x86_64 above.
          - os: ubuntu-22.04-arm
            label: linux-aarch64
            rust_target: aarch64-unknown-linux-gnu
            archive: prism-linux-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux — rdkafka needs libcurl)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      - name: Install protoc (vendored forge_repo needs it on all platforms)
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.rust_target }}

      # Key the cache on the RUNNER IMAGE, not just `runner.os`.
      #
      # Swatinem/rust-cache keys on `runner.os`, which is the string "Linux" —
      # identical across ubuntu-22.04 and ubuntu-24.04. When `ubuntu-latest`
      # rolled from 22.04 to 24.04, cached objects built against one glibc were
      # restored onto the other and the link failed with
      # `undefined symbol: __isoc23_strtoll` (a glibc 2.38+ symbol). That is
      # what killed the linux-x86_64 and linux-aarch64 jobs on 27 Jul.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-${{ matrix.os }}-${{ matrix.rust_target }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dashboard deps
        run: cd dashboard && npm ci

      - name: Build dashboard bundle
        run: cd dashboard && npm run build

      - name: Build Rust binaries
        run: cargo build --release --bin prism --bin prism-node --target ${{ matrix.rust_target }}

      - name: Assemble package
        shell: bash
        run: |
          mkdir -p package
          if [[ "${{ matrix.label }}" == *"windows"* ]]; then
            cp target/${{ matrix.rust_target }}/release/prism.exe package/
            cp target/${{ matrix.rust_target }}/release/prism-node.exe package/
            cd package && 7z a -tzip ../${{ matrix.archive }} . && cd ..
          else
            cp target/${{ matrix.rust_target }}/release/prism package/
            cp target/${{ matrix.rust_target }}/release/prism-node package/
            # macOS: ad-hoc sign binaries so users only need to clear quarantine
            if [[ "${{ matrix.label }}" == *"macos"* ]]; then
              codesign -s - -f package/prism
              codesign -s - -f package/prism-node
            fi
            tar -C package -czf ${{ matrix.archive }} .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          overwrite: true

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}

  # Pure-python wheel for the tool platform. install.sh pip-installs this
  # from the release assets (no git needed on the target box).
  python-wheel:
    name: Package Python wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: python3 -m pip wheel . --no-deps -w dist/

      - uses: actions/upload-artifact@v4
        with:
          name: prism-platform-wheel
          path: dist/*.whl
          overwrite: true

      - name: Publish wheel to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl

  # Aggregate SHA256 hashes of every published asset into SHA256SUMS and
  # attach it to the release. install.sh verifies downloads against it.
  # Runs only when every builder succeeded, so a published SHA256SUMS always
  # covers the complete asset set (v1.0.0 predates this job; install.sh
  # degrades to a warning for releases that have no SHA256SUMS).
  checksums:
    name: Generate SHA256SUMS
    needs: [package-native, python-wheel]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd assets
          for f in *; do
            sha256sum "$f"
          done > ../SHA256SUMS
          cat ../SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: SHA256SUMS
          overwrite: true

      - name: Publish SHA256SUMS to release
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS

  # A release is all-or-nothing. `fail-fast: false` plus a per-job
  # `softprops/action-gh-release` means each platform publishes independently,
  # so when one job fails the tag still gets a release — just missing that
  # archive. That is exactly how v1.0.0 shipped without
  # prism-macos-x86_64.tar.gz while install.sh computed that very name for
  # Intel Macs: every such user got a 404 from the documented one-liner, and
  # nothing anywhere went red.
  #
  # This job audits the ACTUAL release contents and fails when an expected
  # asset is absent. `if: always()` is load-bearing: with plain `needs:`,
  # a failed or skipped dependency skips this job too — exactly when the
  # audit is most needed.
  verify-release-complete:
    name: Verify all release assets published
    needs: [checksums]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check every expected asset exists on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Must match the archive names install.sh computes from uname,
          # plus the checksum manifest and the pinned Python wheel.
          expected="prism-linux-x86_64.tar.gz
          prism-linux-aarch64.tar.gz
          prism-macos-aarch64.tar.gz
          prism-macos-x86_64.tar.gz
          prism-windows-x86_64.zip
          prism_platform-${TAG#v}-py3-none-any.whl
          SHA256SUMS"

          published=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "Published assets:"; echo "$published" | sed 's/^/  /'

          missing=0
          while read -r asset; do
            [ -z "$asset" ] && continue
            if ! echo "$published" | grep -qx "$asset"; then
              echo "::error::release $TAG is missing $asset — install.sh will 404 for that platform"
              missing=1
            fi
          done <<< "$(echo "$expected" | sed 's/^[[:space:]]*//')"

          if [ "$missing" -ne 0 ]; then
            echo "Incomplete release. Re-run the failed platform job, then re-run this check."
            exit 1
          fi
          echo "All platform archives present."
