# ── What is deliberately NOT here ────────────────────────────────────────
# The MARC27 hosted service layer. It lives in a separate repository under a
# separate owner and licence, and is expressly excluded from the PRISM
# Product IP. PRISM calls those services; that creates no ownership interest
# in either direction. `crates/core/providers.toml` keeps the hosted platform
# as one provider row among many, and `crates/runtime/src/platform_env.rs`
# keeps its endpoints reachable under provider-neutral names, so the product
# is portable off it.
#
# No ESA, partner-restricted or customer data is committed to this
# repository. Project-funded foreground and partner background are governed
# by their own contracts and are tracked outside this manifest.
