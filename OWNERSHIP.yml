# PRISM — ownership and licence manifest
#
# Maps every tracked directory to an owner, a licence, a layer and its
# permitted use. Required by the PRISM/Mirdyne IP architecture (section 5.2)
# as the "technical evidence of legal boundaries" (section 9, step 9), and it
# is the evidence row behind two investor-control questions (section 8):
# "Are open-source obligations known?" and "Are any assets jointly owned
# without rules?"
#
# This file RECORDS a documented position. It does not grant, assign or amend
# any right. Where it and a signed instrument disagree, the instrument wins.
#
# Rule of construction: no joint ownership. Every path has exactly one owner.
# A module that cannot be split is assigned to one owner and the other party
# receives a documented cross-licence.

version: 1
updated: 2026-08-07

owners:
  mirdyne:
    legal_name: Mirdyne GmbH
    jurisdiction: Germany
    role: Owner of the PRISM product. Licensor.
  marc27:
    legal_name: MARC27 Internet Private Limited
    jurisdiction: India
    role: >-
      Hosted service provider. Non-exclusive and replaceable. Owns no part of
      this repository. See NOTICE.
  third_party:
    legal_name: Various upstream licensors
    role: Retain their own licences; nothing here claims ownership of them.

licences:
  mirdyne-source-available:
    file: LICENSE-MIRDYNE
    spdx: LicenseRef-Mirdyne-Dual
    commercial_use: Requires a written agreement with Mirdyne.
  mit:
    file: LICENSE-MIT
    spdx: MIT
    commercial_use: Permitted.
  apache-2.0:
    file: LICENSE-APACHE-2.0
    spdx: Apache-2.0
    commercial_use: Permitted, with notice obligations.

# ── Layers ───────────────────────────────────────────────────────────────
# product-core  Local runtime, engine, interfaces, provenance, client, SDK.
# open-tools    Python tools and plugins, deliberately MIT.
# third-party   Vendored or derived from upstream; upstream licence governs.

