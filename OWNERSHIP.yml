  - path: crates/**
    owner: mirdyne
    licence: mirdyne-source-available
    layer: product-core
    funding: Mirdyne internal
    permitted_use: >-
      View, audit and run for evaluation and non-commercial research.
      Commercial use, redistribution and derivative works require a written
      agreement.
    notes: >-
      All 24 crates inherit licence and authors from [workspace.package] in
      Cargo.toml. No crate declares its own.

